name: CI
on:
  push:
    branches: [main]
  pull_request:

# AUDIT DEP-06 (2026-08-17): least-privilege token. CI only reads the tree — it never
# comments, opens issues, updates checks or writes releases. Without this block the job
# inherits the repo default, which is contents: read/write on many repos.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAMBRA_RELEASE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Remove generated release state
        shell: bash
        run: |
          rm -rf -- .release-evidence .release-artifacts base44/.deploy
          rm -f -- RELEASE.json
      - name: Configure Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Configure exact npm
        run: npm install --global npm@11.17.0
      - run: npm ci
      # Keep remote verification identical to the governed local release gate.
      # Adding a check to package.json must therefore also add it to CI instead
      # of leaving a green-but-partial workflow behind.
      - name: Run full governed verification
        run: npm run verify
      - run: npm run release:package
      - name: Validate final packaged evidence
        run: npm run release:check:ci
      - name: Upload repository verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ success() }}
        with:
          name: cambra-repository-verification-${{ env.CAMBRA_RELEASE_GIT_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
          path: |
            .release-evidence/
            .release-artifacts/
            RELEASE.json
            base44/.deploy/
