# v62.1 CP6.1 — CI gate for PRs and the main branch.
#
# ⚠️ MANUAL REQUIRED: Base44's GitHub sync has no permission to write
# .github/workflows/. Copy this file VERBATIM to .github/workflows/ci.yml in
# the GitHub repository (a human with workflow permissions must commit it).
#
# Clean checkout, pinned Node (via .nvmrc), npm ci, then the same ordered gate
# as `npm run verify`. No secrets are used; no inherited node_modules.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run clean:check
      - run: npm run policy:check
      - run: npm run lint
      - run: npm run typecheck:critical
      - run: npm run typecheck:baseline
      - run: npm test
      - run: npm run build
      - run: npm run release:check