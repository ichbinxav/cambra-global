name: CI
on:
  push:
    branches: [main]
  pull_request:

# AUDIT DEP-06 (2026-08-17): least-privilege token. CI only reads the tree — it never
# comments, opens issues, updates checks or writes releases. Without this block the job
# inherits the repo default, which is contents: read/write on many repos.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAMBRA_RELEASE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Remove generated release state
        shell: bash
        run: |
          rm -rf -- .release-evidence .release-artifacts base44/.deploy
          rm -f -- RELEASE.json
      - name: Configure Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run toolchain:check
      - run: npm run policy:check
      - run: npm run clean:check
      - run: npm run markets:check
      - run: npm run locales:check
      - run: npm run growth:check
      - run: npm run ecl:check
      - run: npm run durability:check
      - run: npm run documentation:check
      - run: npm run scheduler:check
      - run: npm run scheduler:hardening:check
      - run: npm run retention:check
      - run: npm run secrets:check
      - run: npm run public-errors:check
      - run: npm run silent-failures:check
      - run: npm run dependency:audit
      - run: npm run base44:functions:check
      - run: npm run ci:check
      - run: npm run lint:evidence
      - run: npm run typecheck:critical:evidence
      - run: npm run typecheck:baseline:evidence
      - run: npm run test:evidence
      - run: npm run build:evidence
      - run: npm run release:manifest
      - run: npm run release:check:ci
      - run: npm run release:package
      - name: Validate final packaged evidence
        run: npm run release:check:ci
      - name: Upload repository verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ success() }}
        with:
          name: cambra-repository-verification-${{ env.CAMBRA_RELEASE_GIT_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
          path: |
            .release-evidence/
            .release-artifacts/
            RELEASE.json
            base44/.deploy/
