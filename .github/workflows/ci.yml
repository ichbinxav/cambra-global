name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run toolchain:check
      - run: npm run policy:check
      - run: npm run clean:check
      - run: npm run markets:check
      - run: npm run locales:check
      - run: npm run growth:check
      - run: npm run ecl:check
      - run: npm run durability:check
      - run: npm run documentation:check
      - run: npm run scheduler:check
      - run: npm run scheduler:hardening:check
      - run: npm run retention:check
      - run: npm run secrets:check
      - run: npm run public-errors:check
      - run: npm run silent-failures:check
      - run: npm run dependency:audit
      - run: npm run base44:functions:check
      - run: npm run ci:check
      - run: npm run lint:evidence
      - run: npm run typecheck:critical:evidence
      - run: npm run typecheck:baseline:evidence
      - run: npm run test:evidence
      - run: npm run build:evidence
      - run: npm run release:manifest
      - run: npm run release:check:ci
      - run: npm run release:package
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: release-evidence
          path: |
            .release-evidence/
            .release-artifacts/
            RELEASE.json
            base44/.deploy/manifest.json
