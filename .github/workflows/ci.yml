name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run policy:check
      - run: npm run clean:check
      - run: npm run lint:evidence
      - run: npm run typecheck:critical:evidence
      - run: npm run typecheck:baseline:evidence
      - run: npm run test:evidence
      - run: npm run build:evidence
      - run: npm run release:manifest
      - run: npm run release:check:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: .release-evidence/
