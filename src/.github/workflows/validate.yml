name: Validate CAMBRA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npx vitest run

      - name: Check zero alert calls
        run: |
          if grep -R "alert(" src; then
            echo "Found alert() calls"
            exit 1
          fi

      - name: Check no nested Base44 entry files
        run: |
          FOUND=$(find base44/functions -path "*/entry/entry.ts")
          if [ -n "$FOUND" ]; then
            echo "$FOUND"
            exit 1
          fi

      - name: Check README is CAMBRA-specific
        run: |
          if grep -R "Welcome to your Base44 project" README.md; then
            echo "Default Base44 README still present"
            exit 1
          fi

      - name: Check .env.example exists
        run: test -f .env.example

      - name: Production audit
        run: npm audit --omit=dev